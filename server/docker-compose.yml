# Docker Compose の設定ファイル
# このファイル1つで「DB + API」をまとめて起動できる

services:
  # =========================
  # データベース（PostgreSQL）
  # =========================
  db:
    image: postgres:16 # PostgreSQLの公式イメージ（バージョン16）を使う
    container_name: household-db # コンテナの名前（docker ps で見やすくする）

    # PostgreSQLの初期設定
    environment:
      POSTGRES_DB: household # 作成されるDB名
      POSTGRES_USER: household # DBに接続するユーザー名
      POSTGRES_PASSWORD: household # そのユーザーのパスワード
    volumes:
      - db-data:/var/lib/postgresql/data # コンテナ内のDB保存場所を、名前付きボリュームに保存
    ports:
      - "127.0.0.1:5432:5432" # PC内からのみ接続可（LANの他機器からは接続不可）

  # =========================
  # API（FastAPI想定）
  # =========================
  api:
    # 今のディレクトリにある Dockerfile を使ってイメージを作る
    build: .
    container_name: household-api     # コンテナの名前（docker ps で見やすくする）
    depends_on: # DBコンテナが先に起動してからAPIを起動する
      - db
    volumes:     # ソースコードの共有設定
      # PCのカレントディレクトリを、コンテナ内 /code にマウント
      # → コード変更が即反映される（開発用）
      - .:/code

    # APIの公開ポート
    ports:
      - "8000:8000" # PCの http://localhost:8000 でAPIにアクセスできる

    environment: # API用の環境変数
      DATABASE_URL: postgresql+psycopg://household:household@db:5432/household # DB接続URL
      # APIキーと外部公開URLは server/.env に書く（.env はGitに含めない）
      API_KEY: ${API_KEY:?server/.env に API_KEY を設定してください}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      CORS_ORIGINS: "https://household-app.vercel.app,http://localhost:5173"
      HOST_IP: "192.168.0.34"
      FRONTEND_URL: "https://household-app.vercel.app"
      ALLOW_SUBNETS: "192.168.0.0/24,172.16.0.0/12"
      # Notion 連携（POST /notion/sync）。server/.env に書く
      NOTION_TOKEN: ${NOTION_TOKEN:-}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:-}

  # =========================
  # Notion 月次同期（毎月1日 6:00 JST に先月分を送る）
  # =========================
  notion-scheduler:
    build: .
    container_name: household-notion-scheduler
    depends_on:
      - db
    volumes:
      - .:/code
    command: ["python", "-m", "app.jobs.notion_scheduler"]
    restart: unless-stopped # PC再起動後も Docker Desktop の起動とともに動かす
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql+psycopg://household:household@db:5432/household
      NOTION_TOKEN: ${NOTION_TOKEN:?server/.env に NOTION_TOKEN を設定してください}
      NOTION_DATA_SOURCE_ID: ${NOTION_DATA_SOURCE_ID:?server/.env に NOTION_DATA_SOURCE_ID を設定してください}

# =========================
# ボリューム定義
# =========================
volumes:
  db-data: # PostgreSQLのデータ保存用ボリューム
